services:
  api:
    build:
      context: .
      dockerfile: src/TecnoMarket.Api/Dockerfile
    ports:
      - "5204:8080"
    environment:
      ConnectionStrings__Supabase: ${SUPABASE_CONNECTION_STRING}

  web:
    build:
      context: .
      dockerfile: src/TecnoMarket.Web/Dockerfile
    ports:
      - "5000:8080"
    environment:
      Api__BaseUrl: ${API_PUBLIC_URL:-http://localhost:5204/}
